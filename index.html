<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroArch Web - Pokémon GBC</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 70vh;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Contenedor iframe oficial de RetroArch Web / Buildbot -->
        <iframe src="https://web.libretro.com/?core=gambatte&rom=https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/Pokemon-Rojo-GBC.gbc" allowfullscreen></iframe>
    </div>

    <div style="margin-top: 10px; font-size: 13px; color: #888; text-align: center;">
        Compatible con controles táctiles y guardado en la nube/navegador
    </div>

</body>
</html>
