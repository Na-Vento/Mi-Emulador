<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador GBC - Pokémon</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #wasmboy-container {
            width: 100%;
            max-width: 420px;
            height: 65vh;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .info {
            margin-top: 15px;
            font-size: 14px;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="wasmboy-container"></div>
    <div class="info">Cargando juego y controles táctiles...</div>

    <!-- Importar WasmBoy mediante CDN estable -->
    <script src="https://cdn.jsdelivr.net/npm/@wasmboy/wasmboy@latest/dist/wasmboy.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const container = document.getElementById('wasmboy-container');
            
            try {
                // Configuración apuntando exactamente a tu ruta y archivo
                await WasmBoy.config({
                    cartridgeURL: './Roms/Pokemon-Rojo-GBC.gbc',
                    audioEnabled: true,
                    isGbcColorization: true,
                });

                await WasmBoy.play();
                document.querySelector('.info').innerText = "¡Partida lista! Compatible con controles táctiles y guardado.";
            } catch (error) {
                console.error("Error al iniciar WasmBoy:", error);
                document.querySelector('.info').innerText = "Error al cargar la ROM. Verifica que esté en la carpeta Roms.";
            }
        });
    </script>
</body>
</html>
