<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Edición Roja</title>
    <style>
        * { touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gambatte'; // Núcleo ultra liviano que reduce el tiempo de inicio
        EJS_gameName = 'Pokemon Rojo';
        EJS_gameUrl = 'Roms/Pokemon - Rojo - GBC.gbc';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Optimización de rendimiento y botones para Android
        EJS_startOnLoaded = true;
        EJS_loadStateURL = ''; 
        EJS_language = 'es';
        
        // Configuración de controles táctiles
        EJS_VirtualGamepadSettings = {
            enable: true,
            style: 'touch'
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
