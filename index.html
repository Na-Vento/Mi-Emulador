<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulador GBC Online</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 4px solid #444;
            background-color: #000;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <h1>Pokémon Rojo - GBC</h1>
    <!-- Canvas donde correrá el emulador -->
    <canvas id="screen" width="160" height="144"></canvas>

    <!-- Carga el script del emulador -->
    <script src="gb.js"></script>
    <script>
        window.onload = function() {
            // Ruta a tu ROM en el repositorio
            const romPath = "Roms/Pokemon%20-%20Rojo%20-%20GBC.gbc";

            // Petición para descargar la ROM en formato binario (ArrayBuffer)
            fetch(romPath)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar la ROM");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    const canvasElement = document.getElementById("screen");
                    
                    // Inicializar el núcleo de GameBoy con el canvas y la ROM
                    try {
                        const gb = new GameBoyCore(canvasElement, buffer);
                        console.log("Emulador iniciado correctamente");
                    } catch (e) {
                        console.error("Error al iniciar GameBoyCore:", e);
                    }
                })
                .catch(error => console.error("Error:", error));
        };
    </script>
</body>
</html>
