<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Rojo</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        #display-container { width: 100vw; height: 40vh; display: flex; justify-content: center; align-items: center; background: #000; }
        #game { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
        
        /* Controles táctiles estilo My Boy! */
        #controls { width: 100vw; height: 55vh; display: grid; grid-template-columns: 1fr 1fr; padding: 10px; gap: 10px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 160px; height: 160px; margin: auto; }
        .btn { background: #333; border: 2px solid #555; border-radius: 10px; color: #fff; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 18px; active { background: #666; } }
        .btn-dir { background: #222; border-radius: 5px; }
        .action-btns { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .btn-round { width: 60px; height: 60px; border-radius: 50%; background: #a00; border: 3px solid #f00; font-size: 20px; }
        .btn-b { background: #aa0; border-color: #ff0; }
        .system-btns { grid-column: span 2; display: flex; justify-content: center; gap: 30px; height: 40px; }
        .btn-sys { width: 80px; height: 30px; border-radius: 15px; font-size: 12px; background: #444; }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="game"></div>
    </div>

    <div id="controls">
        <!-- D-PAD (Cruceta) -->
        <div class="dpad">
            <div></div><div class="btn btn-dir" id="btn-up">▲</div><div></div>
            <div class="btn btn-dir" id="btn-left">◄</div><div></div><div class="btn btn-dir" id="btn-right">►</div>
            <div></div><div class="btn btn-dir" id="btn-down">▼</div><div></div>
        </div>

        <!-- Botones A y B -->
        <div class="action-btns">
            <div class="btn btn-round btn-b" id="btn-b">B</div>
            <div class="btn btn-round" id="btn-a">A</div>
        </div>

        <!-- Start y Select -->
        <div class="system-btns">
            <div class="btn btn-sys" id="btn-select">SELECT</div>
            <div class="btn btn-sys" id="btn-start">START</div>
        </div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gb';
        EJS_gameName = 'Pokemon Rojo';
        EJS_gameUrl = 'Roms/Pokemon - Rojo - GBC.gbc';
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/'; // Servidor ultra rápido por CDN
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = { enable: false }; // Desactiva los controles viejos molestos
    </script>
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/loader.js"></script>
</body>
</html>
