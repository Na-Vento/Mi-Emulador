<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Rojo</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #screen-container { width: 100vw; height: 42vh; display: flex; justify-content: center; align-items: center; background: #050505; }
        canvas { width: 160px; height: 144px; max-width: 100%; max-height: 100%; transform: scale(2.2); transform-origin: center; image-rendering: pixelated; }

        /* Controles estilo My Boy! */
        #pad { width: 100vw; height: 58vh; background: #121212; display: flex; flex-direction: column; justify-content: space-around; padding: 15px; }
        .main-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .dpad { width: 150px; height: 150px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .d-btn { background: #252525; border: 1px solid #3d3d3d; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #888; }
        .d-btn:active { background: #555; color: #fff; }

        .action-btns { display: flex; gap: 15px; align-items: center; margin-right: 10px; }
        .a-b { width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; }
        .btn-a { background: #b91c1c; border: 2px solid #ef4444; }
        .btn-b { background: #d97706; border: 2px solid #f59e0b; margin-top: 20px; }
        .a-b:active { opacity: 0.7; }

        .sub-controls { display: flex; justify-content: center; gap: 30px; }
        .s-btn { background: #2a2a2a; width: 80px; height: 30px; border-radius: 15px; font-size: 12px; display: flex; justify-content: center; align-items: center; color: #aaa; border: 1px solid #444; }
        .s-btn:active { background: #555; color: #fff; }
    </style>
</head>
<body>

    <div id="screen-container">
        <canvas id="display" width="160" height="144"></canvas>
    </div>

    <div id="pad">
        <div class="main-controls">
            <div class="dpad">
                <div></div><div class="d-btn" id="btn-up">▲</div><div></div>
                <div class="d-btn" id="btn-left">◄</div><div></div><div class="d-btn" id="btn-right">►</div>
                <div></div><div class="d-btn" id="btn-down">▼</div><div></div>
            </div>
            <div class="action-btns">
                <div class="a-b btn-b" id="btn-b">B</div>
                <div class="a-b btn-a" id="btn-a">A</div>
            </div>
        </div>
        <div class="sub-controls">
            <div class="s-btn" id="btn-select">SELECT</div>
            <div class="s-btn" id="btn-start">START</div>
        </div>
    </div>

    <!-- Cargador universal nativo por iframe ultraliviano -->
    <script>
        const ROM_PATH = 'Roms/Pokemon - Rojo - GBC.gbc';

        // Simular eventos de teclado para el motor
        function sendKey(key, code, isDown) {
            const eventType = isDown ? 'keydown' : 'keyup';
            const event = new KeyboardEvent(eventType, {
                key: key,
                code: code,
                keyCode: code,
                which: code,
                bubbles: true
            });
            window.dispatchEvent(event);
        }

        function bindTouch(id, key, code) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); sendKey(key, code, true); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); sendKey(key, code, false); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); sendKey(key, code, true); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); sendKey(key, code, false); });
        }

        // Mapeo estándar estilo Game Boy
        bindTouch('btn-up', 'ArrowUp', 38);
        bindTouch('btn-down', 'ArrowDown', 40);
        bindTouch('btn-left', 'ArrowLeft', 37);
        bindTouch('btn-right', 'ArrowRight', 39);
        bindTouch('btn-a', 'x', 88);
        bindTouch('btn-b', 'z', 90);
        bindTouch('btn-start', 'Enter', 13);
        bindTouch('btn-select', 'Shift', 16);
    </script>

    <script type="text/javascript">
        // Inicialización ligera de respaldo
        EJS_player = '#screen-container';
        EJS_core = 'gambatte';
        EJS_gameName = 'Pokemon Rojo';
        EJS_gameUrl = ROM_PATH;
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/';
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = { enable: false };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/loader.js"></script>
</body>
</html>
