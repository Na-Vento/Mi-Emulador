<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador GBC Automático</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #game {
            width: 100%;
            max-width: 450px;
            height: 70vh;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        // Configuración de EmulatorJS apuntando al enlace RAW directo de tu repositorio
        window.EJS_player = "#game";
        window.EJS_core = "gb";
        // Reemplaza TU_USUARIO y TU_REPO con los datos reales de tu GitHub
        window.EJS_gameUrl = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/Pokemon-Rojo-GBC.gbc";
        window.EJS_autostart = true;
        window.EJS_color = "#1e293b";
        window.EJS_startOnLoaded = true;
        window.EJS_controls = {
            useDatabase: true
        };
    </script>
    <script src="https://www.emulatorjs.com/stable/data/loader.js"></script>

</body>
</html>
