<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Rojo</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #screen-container { width: 100vw; height: 45vh; display: flex; justify-content: center; align-items: center; background: #050505; }
        canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; }

        /* Controles táctiles My Boy! */
        #pad { width: 100vw; height: 55vh; background: #151515; display: grid; grid-template-rows: 1fr 40px; padding: 15px; }
        .main-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        /* D-Pad */
        .dpad { width: 150px; height: 150px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .d-btn { background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .d-btn:active { background: #555; }

        /* Buttons A/B */
        .action-btns { display: flex; gap: 15px; align-items: center; margin-right: 10px; }
        .a-b { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; box-shadow: 0 4px 0 #000; }
        .btn-a { background: #c02626; }
        .btn-b { background: #d97706; margin-top: 25px; }
        .a-b:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }

        /* Menu / Start / Select */
        .sub-controls { display: flex; justify-content: center; gap: 20px; }
        .s-btn { background: #333; width: 70px; height: 25px; border-radius: 12px; font-size: 11px; display: flex; justify-content: center; align-items: center; color: #aaa; }
        .s-btn:active { background: #666; color: #fff; }
    </style>
</head>
<body>

    <div id="screen-container">
        <canvas id="display" width="160" height="144"></canvas>
    </div>

    <div id="pad">
        <div class="main-controls">
            <div class="dpad">
                <div></div><div class="d-btn" id="up">▲</div><div></div>
                <div class="d-btn" id="left">◄</div><div></div><div class="d-btn" id="right">►</div>
                <div></div><div class="d-btn" id="down">▼</div><div></div>
            </div>
            <div class="action-btns">
                <div class="a-b btn-b" id="b">B</div>
                <div class="a-b btn-a" id="a">A</div>
            </div>
        </div>
        <div class="sub-controls">
            <div class="s-btn" id="select">SELECT</div>
            <div class="s-btn" id="start">START</div>
        </div>
    </div>

    <!-- Motor JS Ultra Liviano -->
    <script src="https://cdn.jsdelivr.net/gh/bfirsh/jsgbc@master/dist/jsgbc-max.js"></script>
    <script>
        const ROM_PATH = 'Roms/Pokemon - Rojo - GBC.gbc';

        // Inicialización instantánea
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(ROM_PATH);
                const buffer = await response.arrayBuffer();
                
                const gbc = new GameBoyColor(document.getElementById('display'));
                gbc.loadRom(new Uint8Array(buffer));
                gbc.start();

                // Mapeo de controles táctiles a teclado
                const mapBtn = (id, key) => {
                    const el = document.getElementById(id);
                    el.addEventListener('touchstart', (e) => { e.preventDefault(); gbc.keyDown(key); });
                    el.addEventListener('touchend', (e) => { e.preventDefault(); gbc.keyUp(key); });
                };

                mapBtn('up', 'Up'); mapBtn('down', 'Down');
                mapBtn('left', 'Left'); mapBtn('right', 'Right');
                mapBtn('a', 'a'); mapBtn('b', 'b');
                mapBtn('start', 'Start'); mapBtn('select', 'Select');

            } catch (e) {
                console.error("Error al cargar la ROM", e);
            }
        });
    </script>
</body>
</html>
