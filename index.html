<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Edición Roja</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gb'; // 'gb' es el núcleo para Game Boy y Game Boy Color
        EJS_gameName = 'Pokemon Rojo';
        EJS_gameUrl = 'Roms/Pokemon - Rojo - GBC.gbc'; // Ruta exacta con mayúsculas y espacios
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
